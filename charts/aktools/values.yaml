# Default values for aktools.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  # Not an upstream image: akfamily publishes aktools to PyPI only, so the
  # image is built here, from the context in image/. Every dependency is pinned
  # in image/requirements.txt, because the upstream Dockerfile installs them
  # all with `--upgrade` and no constraints. The old starlette 1.x hold is
  # gone: aktools 0.1.x uses the Starlette 1.x TemplateResponse signature.
  #
  # Rebuild from the repository root:
  #   make images.aktools          # tag defaults to appVersion, below
  #
  # The Build Images workflow runs the same target on every push that touches
  # image/ (see the repository README).
  #
  # Pushing over the tag that is already deployed rolls nothing: the rendered
  # manifest is unchanged, so Argo CD sees no diff, and a node holding the old
  # image under that tag will not pull again under IfNotPresent. After such a
  # push, drop the cached image on every node that runs it - kubectl debug
  # node/<node>, then `crictl rmi docker.io/eslizn/aktools:<tag>` - and delete
  # the Pod so it is recreated and re-pulls.
  repository: docker.io/eslizn/aktools
  # Empty falls back to Chart.yaml appVersion: the aktools release the image was
  # built from. An image rebuild keeps that tag, so it needs the node image
  # cache cleared by hand (above).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration.
workload:
  kind: Deployment
  ports:
    - name: http
      containerPort: 8080
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

# 0.1.x adds an optional token for /api/ and /mcp. It is ordinary container
# configuration, so set it through workload.env (from a Secret) rather than a
# chart specific key: AKTOOLS_TOKEN.

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
service:
  main:
    type: ClusterIP
    port: 8080
    targetPort: http

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aktools
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
