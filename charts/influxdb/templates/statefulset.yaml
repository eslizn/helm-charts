{{- $persistence := .Values.persistence -}}
{{- $args := list "serve" "--node-id=${HOSTNAME}" -}}
{{- if $persistence.enabled -}}
{{- $args = concat $args (list "--object-store=file" (printf "--data-dir=%s/influxdb" $persistence.mountPath) (printf "--plugin-dir=%s/plugins" $persistence.mountPath)) -}}
{{- end -}}
{{- /* without persistence the data directory is an emptyDir that dies with the pod */ -}}
{{- $volumes := list -}}
{{- $volumeMounts := list -}}
{{- if not $persistence.enabled -}}
{{- $volumes = list (dict "name" "ephemeral-data" "emptyDir" (dict)) -}}
{{- $volumeMounts = list (dict "name" "ephemeral-data" "mountPath" $persistence.mountPath) -}}
{{- end -}}
{{- $name := include "common.fullname" . -}}
{{- include "common.statefulset" (dict "ctx" $ "args" $args "ports" (list (dict "name" .Values.service.main.portName "containerPort" .Values.service.main.targetPort "protocol" "TCP")) "volumes" $volumes "volumeMounts" $volumeMounts "serviceName" (printf "%s-headless" $name)) }}
