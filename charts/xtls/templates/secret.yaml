{{/* A Secret rather than a ConfigMap: config.json carries the REALITY private
       key and the client UUIDs, which are credentials. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
data:
  config.json: {{ .Values.options | toJson | b64enc | quote }}
