apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
{{- /* The config file is only mounted (and MINDSDB_CONFIG_FILE only set) when
       persistence is enabled, so storage_dir follows the same value: a hardcoded
       /storage would silently disagree with a custom persistence.mountPath. */}}
data:
  config.json: |
    {
      "config_version": "1.4",
      "storage_dir": "{{ .Values.persistence.mountPath | default "/storage" }}",
      "debug": false,
      "integrations": {},
      "api": {
        "http": {
          "host": "0.0.0.0",
          "port": "47334"
        },
        "mysql": {
          "host": "0.0.0.0",
          "password": "",
          "port": "47335",
          "user": "mindsdb",
          "database": "mindsdb",
          "ssl": true
        },
        "mongodb": {
          "host": "0.0.0.0",
          "port": "47336",
          "database": "mindsdb"
        }
      }
    }
