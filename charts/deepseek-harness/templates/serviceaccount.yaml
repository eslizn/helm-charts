{{/*
Rendered here instead of through common.serviceaccount because the shared
template uses {{ "{{- with .Values.serviceAccount.automount }}" }}: a false value
is treated as empty and omitted, which leaves the cluster default (true) in
place. This chart deliberately defaults automount to false, so it has to render
the field explicitly.
*/}}
{{- if .Values.serviceAccount.create }}
{{- $automount := .Values.serviceAccount.automount }}
{{- if kindIs "invalid" $automount }}
{{- $automount = true }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $automount }}
{{- end }}
