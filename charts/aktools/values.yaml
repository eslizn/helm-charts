# Default values for aktools.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  # Not an upstream image: akfamily publishes aktools to PyPI only, so this is
  # built from the Dockerfile in the upstream repository with the aktools
  # version pinned, and pushed here. Rebuild for a new release with:
  #   curl -sO https://raw.githubusercontent.com/akfamily/aktools/master/Dockerfile
  #   sed -i '' 's/aktools -i/aktools==<aktools version> -i/' Dockerfile
  #   docker buildx build --platform linux/amd64,linux/arm64 \
  #     -t eslizn/aktools:<aktools version> --push .
  repository: docker.io/eslizn/aktools
  # Empty falls back to Chart.yaml appVersion: the aktools release the image was
  # built from.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration.
workload:
  kind: Deployment
  ports:
    - name: http
      containerPort: 8080
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
service:
  main:
    type: ClusterIP
    port: 8080
    targetPort: http

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aktools
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
