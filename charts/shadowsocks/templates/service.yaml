{{- $main := .Values.service.main -}}
{{- $kcptun := .Values.kcptun -}}
{{- $isNodePort := eq $main.type "NodePort" -}}
{{- $isLoadBalancer := contains "LoadBalancer" $main.type -}}
{{- $hasKcptun := and $kcptun.enabled $kcptun.port -}}
{{- /* A LoadBalancer cannot serve TCP and UDP at once: the UDP port moves to the
       second service below. */ -}}
{{- $mainPorts := list -}}
{{- $tcp := dict "name" $main.portName "port" $main.port "targetPort" "ss-tcp" "protocol" "TCP" -}}
{{- if $isNodePort -}}
{{- $_ := set $tcp "nodePort" $main.nodePort -}}
{{- end -}}
{{- $mainPorts = append $mainPorts $tcp -}}
{{- if not $isLoadBalancer -}}
{{- $udp := dict "name" "ss-udp" "port" $main.port "targetPort" "ss-udp" "protocol" "UDP" -}}
{{- if $isNodePort -}}
{{- $_ := set $udp "nodePort" $main.nodePort -}}
{{- end -}}
{{- $mainPorts = append $mainPorts $udp -}}
{{- if $hasKcptun -}}
{{- $mainPorts = append $mainPorts (dict "name" "kcptun" "port" $kcptun.port "targetPort" "kcptun" "protocol" "UDP") -}}
{{- end -}}
{{- end -}}
{{- $services := dict "main" (dict "type" $main.type "annotations" $main.annotations "internalTrafficPolicy" $main.internalTrafficPolicy "ports" $mainPorts) -}}
{{- if and .Values.service.udp.enabled $isLoadBalancer -}}
{{- $udpPorts := list (dict "name" "ss-udp" "port" $main.port "targetPort" "ss-udp" "protocol" "UDP") -}}
{{- if $hasKcptun -}}
{{- $udpPorts = append $udpPorts (dict "name" "kcptun" "port" $kcptun.port "targetPort" "kcptun" "protocol" "UDP") -}}
{{- end -}}
{{- $udpService := dict "type" $main.type "annotations" (mergeOverwrite (dict) ($main.annotations | default dict) (.Values.service.udp.annotations | default dict)) "ports" $udpPorts -}}
{{- if $main.loadBalancerIP -}}
{{- $_ := set $udpService "loadBalancerIP" $main.loadBalancerIP -}}
{{- end -}}
{{- $_ := set $services "udp" $udpService -}}
{{- end -}}
{{- include "common.service" (dict "ctx" $ "services" $services) }}
