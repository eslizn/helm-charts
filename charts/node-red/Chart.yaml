apiVersion: v2
name: node-red
description: Node-RED - low-code programming for event-driven applications
type: application
version: 0.1.1
# Doubles as the default image tag (common.image falls back to appVersion when
# image.tag is empty). Kept as the full upstream tag, node variant included:
# 5.0.7-24 = Node-RED 5.0.7 on Node 24/alpine. Plain 5.0.7 and -debian variants
# exist too, see the chart README.
appVersion: "5.0.7-24"
kubeVersion: ">=1.24.0-0"
home: https://nodered.org
sources:
  - https://github.com/node-red/node-red
  - https://github.com/node-red/node-red-docker
maintainers:
  - name: eslizn
    url: https://github.com/eslizn
dependencies:
  - name: common
    version: 0.1.1
    repository: file://../common
