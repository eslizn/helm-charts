{{/*
Chart local instead of common.testConnection: the launcher console answers on
18800 but needs the dashboard token, so the meaningful check is the gateway
health endpoint the upstream image uses for its own HEALTHCHECK.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "common.fullname" . }}-test-connection"
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "common.fullname" . }}-gateway:{{ .Values.service.gateway.port }}/health']
  restartPolicy: Never
