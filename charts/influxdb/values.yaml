# Default values for influxdb.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.
#
# The chart deploys InfluxDB 3 Core and, when explorer.enabled is set, the
# InfluxDB 3 Explorer UI next to it.

# InfluxDB 3 Core
replicaCount: 1

image:
  repository: influxdb
  tag: 3-core
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration. args are rendered from .Values.persistence.
workload:
  kind: StatefulSet
  command:
    - influxdb3

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
service:
  main:
    type: ClusterIP
    port: 80
    targetPort: 8181
    portName: http
  headless:
    headless: true
    port: 80
    targetPort: 8181
    portName: http

ingress:
  enabled: false
  className: "traefik"
  annotations: {}
  hosts:
    - host: influxdb.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  mountPath: /data
  volumeName: data

resources:
  limits:
    cpu: 8
    memory: 16Gi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# InfluxDB 3 Explorer UI. Its workload always carries an
# app.kubernetes.io/component=explorer label so that it does not share the
# InfluxDB 3 Core selector.
explorer:
  enabled: false
  replicaCount: 1
  image:
    repository: influxdata/influxdb3-ui
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1
      memory: 2G
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    mountPath: /db
    # Size of the second claim that holds /app-root/config.
    configSize: 32Mi
    configMountPath: /app-root/config
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  ingress:
    enabled: false
    className: "traefik"
    annotations: {}
    hosts:
      - host: influxdb-explorer.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
