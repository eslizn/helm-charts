apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.storageClass.provisioner }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: true
  # added in Kubernetes 1.19, this field is GA as of Kubernetes 1.23
  fsGroupPolicy: File
  # added in Kubernetes 1.16, this field is beta
  volumeLifecycleModes:
    - Persistent
