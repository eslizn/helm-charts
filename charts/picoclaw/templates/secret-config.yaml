{{- if .Values.config.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "picoclaw.configSecretName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.key | default "config.json" }}: |
    {{- .Values.config.data | toPrettyJson | nindent 4 }}
{{- end }}
