{{/*
The harness PVC is a standalone resource, not a StatefulSet claim template.
The shared common.statefulset renders volumeClaimTemplates with common.labels,
which include the chart and app versions; that field is immutable, so a chart
bump would make the next upgrade fail. A standalone claim also lets
persistence.existingClaim work and makes persistence.size resizable.
*/}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (ne .Values.persistence.create false) }}
{{- $annotations := deepCopy (.Values.persistence.annotations | default dict) -}}
{{- if .Values.persistence.keep -}}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" -}}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml (.Values.persistence.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "10Gi" }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
