# Default values for shadowsocks.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  repository: shadowsocks/shadowsocks-libev
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration.
workload:
  kind: Deployment
  dnsPolicy: Default
  ports:
    - name: ss-tcp
      containerPort: 8388
      protocol: TCP
    - name: ss-udp
      containerPort: 8388
      protocol: UDP

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
# The ports of both services are derived from .Values.shadowsocks and .Values.kcptun.
service:
  main:
    type: ClusterIP
    port: 8388
    nodePort: 8388
    portName: ss-tcp
    internalTrafficPolicy: Cluster
    annotations: {}
  # A LoadBalancer cannot mix TCP and UDP, so enabling this creates a second,
  # UDP-only LoadBalancer. Only used when service.main.type is LoadBalancer.
  udp:
    enabled: false
    annotations: {}

shadowsocks:
  method: "aes-256-gcm"
  password:
    plainText: "passw0rd"
    # existingSecret:
    #   secretName: ""
    #   passwordKey: password
  dnsServers:
    - "8.8.8.8"
    - "8.8.4.4"
  timeout: "300"

kcptun:
  enabled: false
  port: 29900
  crypt: "" # default: aes
  key:
    plainText: "it's a secret"
    # existingSecret:
    #   secretName: ""
    #   passwordKey: password
  image:
    repository: xtaci/kcptun
    tag: "v20210103"
    pullPolicy: IfNotPresent
  resources: {}
  securityContext: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
