# Default values for mindsdb.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  repository: mindsdb/mindsdb
  # Empty falls back to Chart.yaml appVersion, which is the upstream release
  # tag (v26.1.0, 2026-04-23 - the newest the project has published).
  tag: ""
  pullPolicy: IfNotPresent

# Set to "nvidia" to run the pod with a GPU runtime class; the NVIDIA_* env
# variables are added in that case.
runtimeClass: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration.
workload:
  kind: Deployment
  ports:
    - name: http
      containerPort: 47334
      protocol: TCP
    - name: mysql
      containerPort: 47335
      protocol: TCP
    - name: mongodb
      containerPort: 47336
      protocol: TCP

# Named services: "main" would render as <fullname>, other keys as <fullname>-<key>.
# The http service is the chart entry point: the Ingress and the Helm test pod
# point at it (ingress.service / the testConnection call below).
service:
  http:
    type: ClusterIP
    port: 47334
    portName: http
  mysql:
    type: ClusterIP
    port: 47335
    portName: mysql
  mongodb:
    type: ClusterIP
    port: 47336
    portName: mongodb

ingress:
  enabled: false
  # Backend service of .Values.service to route to.
  service: http
  className: "traefik"
  annotations:
    "traefik.ingress.kubernetes.io/router.entrypoints": "websecure"
    "traefik.ingress.kubernetes.io/router.tls": "true"
    "traefik.ingress.kubernetes.io/router.tls.certresolver": "resolver"
  hosts:
    - host: mindsdb.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Persistent storage for the MindsDB storage directory. When enabled the chart
# creates a PVC, mounts it at persistence.mountPath and points
# MINDSDB_STORAGE_DIR at it; the config ConfigMap is mounted next to it.
persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  mountPath: /storage
  configMountPath: /etc/mindsdb.json

nodeSelector: {}
tolerations: []
affinity: {}
