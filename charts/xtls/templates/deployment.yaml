{{- /* config.json is mounted into the container from the chart ConfigMap. */ -}}
{{- $configMapName := include "common.fullname" . -}}
{{- $volumes := list (dict "name" $configMapName "configMap" (dict "name" $configMapName "items" (list (dict "key" "config.json" "path" "config.json")))) -}}
{{- $volumeMounts := list (dict "name" $configMapName "mountPath" "/etc/xray/") -}}
{{- include "common.deployment" (dict "ctx" $ "volumes" $volumes "volumeMounts" $volumeMounts) }}
