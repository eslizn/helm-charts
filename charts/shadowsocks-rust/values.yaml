# Default values for shadowsocks-rust.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

# This is the shadowsocks config which will be mount to /etc/shadowocks-rust.
# You can put arbitrary yaml here, and it will be translated to json before mounting.
# Container ports, probes and Service ports are all derived from this list.
servers:
- server: "::"
  server_port: 8388
  service_port: 80 # the k8s service port, default to server_port
  password: mypassword
  method: aes-256-gcm
  fast_open: true
  mode: tcp_and_udp
  # plugin: v2ray-plugin
  # plugin_opts: server;tls;host=github.com

# Whether to download v2ray and xray plugin.
downloadPlugins: false

# Release tags for those downloads, e.g. "v1.3.1" and "v1.8.24". Empty means the
# initContainer asks the GitHub API for the newest release of each, which is not
# reproducible (and needs egress to api.github.com from the pod).
pluginVersions:
  v2ray: ""
  xray: ""

# Name of an existing ConfigMap with the config.json for shadowsocks-rust.
# Leave empty to let the chart render the ConfigMap from .Values.servers.
configMapName: ""

# Bind the shadowsocks port to the host, i.e. reach the server through host:port.
hostPort: false

replicaCount: 1

image:
  repository: ghcr.io/shadowsocks/ssserver-rust
  # Empty falls back to Chart.yaml appVersion, which is the upstream release
  # tag (v1.25.0). ghcr.io publishes only v-prefixed version tags.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration. ports and probes are derived from .Values.servers.
workload:
  kind: Deployment

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
# Ports are derived from .Values.servers, so they are not listed here.
service:
  main:
    type: ClusterIP
    annotations: {}

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 32Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
