# Default values for xtls.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  repository: ghcr.io/xtls/xray-core
  # Empty falls back to Chart.yaml appVersion (26.3.27, the newest release
  # upstream does not flag as a prerelease). The image tags drop the leading
  # "v" of the release tag, so this must not be written as v26.3.27.
  tag: ""
  # Pinned tag, so there is nothing to re-check on every start.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration.
workload:
  kind: Deployment
  ports:
    - name: https
      containerPort: 443
      protocol: TCP

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
# targetPort refers to the container port name from workload.ports.
service:
  main:
    type: ClusterIP
    port: 443
    targetPort: https
    # Named like the container port; without it the port would be called "http".
    portName: https
    # Which replica may serve a connection: "" leaves kube-proxy's default (any
    # of them), PreferSameNode keeps it on the node the connecting client runs
    # on and falls back to the other nodes where that one has no replica -
    # unlike internalTrafficPolicy: Local, which drops the connection instead
    # of falling back. Only read by kube-proxy, so it needs ingress.nativeLB.
    trafficDistribution: ""

# Traefik IngressRouteTCP (traefik.io/v1alpha1) for the REALITY inbound: one
# HostSNI rule per serverName found in options.inbounds, TLS passthrough.
ingress:
  traefik: true
  # Dial the Service's ClusterIP instead of resolving the endpoint IPs, so
  # kube-proxy picks the replica and the Service's internalTrafficPolicy /
  # trafficDistribution apply to this hop. With it off, Traefik round-robins
  # the endpoints itself and those Service fields are ignored entirely.
  nativeLB: true
  entryPoints:
    - websecure

# Xray-core configuration, rendered verbatim as the config.json of the Secret
# mounted at /etc/xray/ (a Secret, not a ConfigMap: it holds the REALITY private
# key and the client UUIDs). See https://xtls.github.io/config/ for the schema.
#
# The two credential placeholders below are empty, and xray does not start
# without them: the chart still renders (so it stays lintable) but the container
# exits immediately. Fill them from `xray uuid` and `xray x25519` - the private
# key here, the public key on the client side.
options:
  log:
    loglevel: warning
  inbounds:
    - protocol: vless
      port: 443
      settings:
        clients:
          - id:
            flow: xtls-rprx-vision
        decryption: none
      sockopt:
        acceptProxyProtocol: true
      streamSettings:
        network: tcp
        security: reality
        realitySettings:
          show: false
          dest: www.microsoft.com:443
          xver: 0
          serverNames:
            - www.microsoft.com
          privateKey:
          minClientVer:
          maxClientVer:
          maxTimeDiff: 0
          shortIds:
            - ""
  outbounds:
    - protocol: freedom
    - protocol: blackhole

# Optional nginx sidecar that acts as the REALITY fallback origin. It
# terminates TLS for `host` with the cert-manager certificate and returns a
# page, so a probe that fails REALITY sees a valid certificate instead of a
# closed port. Default off.
#
# The sidecar is single-host: `host` must be the only REALITY serverName, and
# every REALITY inbound has to point at it; the chart fails the render
# otherwise:
#   options.inbounds[].streamSettings.realitySettings.serverNames: [<host>]
#   options.inbounds[].streamSettings.realitySettings.dest: 127.0.0.1:9443
#
# Changing this ConfigMap does not restart the Pod, the same as the xray config
# Secret: bump podAnnotations to roll both containers (nginx reloads neither on
# its own).
origin:
  enabled: false
  # Pinned by digest: this container terminates TLS, so its patch level matters.
  image:
    repository: nginx
    tag: "1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949"
    pullPolicy: IfNotPresent
  # The only REALITY serverName: the certificate is issued for it, nginx
  # terminates TLS for it, and the REALITY `dest` dials it on loopback. No
  # default - the release values name the domain.
  host: ""
  # The TLS listener and the port the REALITY `dest` dials (same Pod).
  port: 9443
  certificate:
    # Let the chart render the cert-manager Certificate for `host`. Off when
    # that Secret is managed elsewhere; `tlsSecretName` then names it.
    enabled: true
    clusterIssuer: letsencrypt-dns
  # Secret mounted at /etc/origin-tls and projected as <host>.crt / <host>.key.
  # Empty derives <fullname>-origin-tls, the Secret the Certificate issues.
  tlsSecretName: ""
  # The Secret is mounted 0440 and nginx runs as 101, so the kubelet has to
  # hand it to this group. Pod level, applied only when the sidecar is enabled.
  fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
