{{/*
InfluxDB 3 Explorer. Rendered by chart-local templates instead of the common
library because a chart with two components needs a second, distinct workload
selector (app.kubernetes.io/component=explorer) - the library renders a single
component per chart.
*/}}
{{- $explorer := .Values.explorer -}}
{{- if $explorer.enabled -}}
{{- $persistence := $explorer.persistence -}}
{{- $name := printf "%s-explorer" (include "common.fullname" .) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: explorer
spec:
  serviceName: {{ $name }}-headless
  replicas: {{ $explorer.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: explorer
  template:
    metadata:
      labels:
        {{- include "common.labels" . | nindent 8 }}
        app.kubernetes.io/component: explorer
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: explorer
          image: {{ include "common.imageRef" (dict "image" $explorer.image "appVersion" "") | quote }}
          imagePullPolicy: {{ $explorer.image.pullPolicy }}
          args:
            - --mode=admin
          ports:
            - name: http
              containerPort: {{ $explorer.service.targetPort }}
              protocol: TCP
          {{- with $explorer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if $persistence.enabled }}
            - name: data
              mountPath: {{ $persistence.mountPath }}
            - name: config
              mountPath: {{ $persistence.configMountPath }}
            {{- else }}
            - name: ephemeral-data
              mountPath: {{ $persistence.mountPath }}
            - name: ephemeral-config
              mountPath: {{ $persistence.configMountPath }}
            {{- end }}
      {{- if not $persistence.enabled }}
      volumes:
        - name: ephemeral-data
          emptyDir: {}
        - name: ephemeral-config
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "common.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ $persistence.size }}
        {{- with $persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
    - metadata:
        name: config
        labels:
          {{- include "common.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ $persistence.configSize }}
        {{- with $persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
