# Default values for aktools.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  # Not an upstream image: akfamily publishes aktools to PyPI only, so the
  # image is built here, from the context in image/. Every dependency is pinned
  # in image/requirements.txt, because the upstream Dockerfile installs them
  # all with `--upgrade` and no constraints - and that is what broke the
  # homepage: fastapi declares only `starlette>=0.46.0`, so an unconstrained
  # resolve takes starlette 1.x, whose TemplateResponse dropped the
  # (name, context) signature aktools 0.0.91 still calls (HTTP 500 on /).
  #
  # Rebuild from the repository root:
  #   make images.aktools
  #
  # The Build Images workflow builds the same target on every push that touches
  # image/, so a rebuild normally lands through CI (see the repository README).
  repository: docker.io/eslizn/aktools
  # The image tag, <appVersion>-<rev>: the aktools release the image was built
  # from plus a revision bumped in the same commit as any change under image/.
  # A rebuild therefore takes a new tag instead of overwriting one that is
  # already deployed, so the rendered manifest changes, Argo CD rolls the
  # workload, and no node image cache has to be cleared by hand. The Makefile
  # reads this value, so the pushed image and this reference cannot drift.
  tag: "0.0.91-1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration.
workload:
  kind: Deployment
  ports:
    - name: http
      containerPort: 8080
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
service:
  main:
    type: ClusterIP
    port: 8080
    targetPort: http

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aktools
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
