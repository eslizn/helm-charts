# Default values for openclaw.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  repository: docker.io/eslizn/openclaw
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Container level configuration.
workload:
  kind: StatefulSet
  # Governing service of the StatefulSet. Empty uses the chart's main service,
  # which templates/service.yaml renders as <fullname>.
  serviceName: ""
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  env:
    # environment variables
    - name: OPENCLAW_GATEWAY_BIND
      value: lan
  ports:
    - name: http
      containerPort: 18789
  # Probes are disabled; uncomment to enable them.
  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: 18789
  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: 18789
  # Additional volumes and volume mounts of the main container. The persistence
  # volume is appended to volumeMounts by templates/statefulset.yaml.
  volumes: []
  volumeMounts: []

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
service:
  main:
    type: ClusterIP
    port: 80
    targetPort: 18789

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: openclaw.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: "4"
    memory: 16Gi
  requests:
    cpu: "500m"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

persistence:
  enabled: true
  # Storage class name - if undefined, uses default storage class
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  # Mount path of the data directory
  mountPath: /root
  # Sub path of the data directory
  subPath: ""
  # Name of the volumeClaimTemplate and of the volume mounted into the container
  volumeName: openclaw-data

nodeSelector: {}
tolerations: []
affinity: {}
