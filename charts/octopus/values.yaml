# Default values for octopus.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.

replicaCount: 1

image:
  repository: docker.io/eslizn/octopus
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Key/value map rendered into the chart ConfigMap and injected into the
# container through envFrom.configMapRef. Empty by default.
env: {}

# Container level configuration.
workload:
  kind: Deployment
  dnsPolicy: Default
  ports:
    - name: http
      containerPort: 3000
  livenessProbe:
    httpGet:
      path: /
      port: 3000
  readinessProbe:
    httpGet:
      path: /
      port: 3000

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
service:
  main:
    type: ClusterIP
    port: 80
    targetPort: http

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: octopus.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
