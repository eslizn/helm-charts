name: Release Charts

on:
  push:
    branches:
      - master

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # The charts depend on the local library chart charts/common, which has to
      # be vendored into every chart before chart-releaser packages them.
      - name: Build chart dependencies
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            helm dependency build "${chart}"
          done

      # Build Images runs in parallel with this workflow on the same push. A
      # chart whose image is built there must not reach the index before the
      # image tag exists, or the published chart pins a tag nobody can pull
      # yet. Wait for every self-built chart's appVersion tag to appear on
      # Docker Hub; a chart-only change passes immediately because the tag is
      # already there. This fails the release rather than publishing a chart
      # whose image never arrives. The 40 minute budget covers an arm64 build
      # under QEMU plus the Futu tarball download.
      - name: Wait for self-built images
        run: |
          set -euo pipefail
          repo="$(sed -n 's/^REPO[[:space:]]*?=[[:space:]]*//p' Makefile)"
          repo="${repo#docker.io/}"
          if [ -z "$repo" ]; then
            echo "no REPO in Makefile" >&2
            exit 1
          fi
          for chart in charts/*/; do
            [ -f "${chart}image/Dockerfile" ] || continue
            name="$(basename "$chart")"
            tag="$(sed -n 's/^appVersion:[[:space:]]*//p' "${chart}Chart.yaml" | tr -d '"')"
            if [ -z "$tag" ]; then
              echo "no appVersion in ${chart}Chart.yaml" >&2
              exit 1
            fi
            url="https://hub.docker.com/v2/repositories/${repo}/${name}/tags/${tag}/"
            echo "==> waiting for ${repo}/${name}:${tag}"
            for attempt in $(seq 1 240); do
              if curl -fs --max-time 20 -o /dev/null "$url"; then
                echo "found ${repo}/${name}:${tag}"
                break
              fi
              if [ "$attempt" -eq 240 ]; then
                echo "timed out waiting for ${repo}/${name}:${tag}" >&2
                exit 1
              fi
              sleep 10
            done
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          config: cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GH_TOKEN }}
