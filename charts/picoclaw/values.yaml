# Default values for picoclaw.
# The schema is shared by every chart in this repository: see
# ../common/templates/_helpers.tpl and the repository README.
#
# This chart runs the launcher image (Web console + gateway):
#   Web console  http://<release>:18800
#   Gateway      http://<release>-gateway:18790  (/health)
# The launcher image ships the upstream defaults
# `-console -public -no-browser` as its command.

replicaCount: 1

image:
  repository: docker.io/sipeed/picoclaw
  # Upstream publishes <version> and <version>-launcher; this chart runs the
  # launcher variant. Use v0.3.1 to run the plain gateway/agent image instead
  # (see the README, it needs a config.json to exist before the gateway starts).
  tag: v0.3.1-launcher
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# The upstream image runs as root and writes to /root/.picoclaw, so this is left
# empty by default.
securityContext: {}

# Container level configuration.
workload:
  kind: Deployment
  ports:
    - name: http
      containerPort: 18800
      protocol: TCP
    - name: gateway
      containerPort: 18790
      protocol: TCP
  # Extra environment variables (TZ, provider keys, ...). PICOCLAW_GATEWAY_HOST
  # is added by the chart from gateway.host.
  env: []

# Named services: "main" is rendered as <fullname>, other keys as <fullname>-<key>.
service:
  main:
    type: ClusterIP
    port: 18800
    targetPort: http
    portName: http
  gateway:
    type: ClusterIP
    port: 18790
    targetPort: gateway
    portName: gateway

ingress:
  enabled: false
  className: "traefik"
  annotations: {}
  hosts:
    - host: picoclaw.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# PicoClaw itself needs very little (it advertises <20MB RAM), the launcher adds
# the web console on top.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 32Mi

# /root/.picoclaw holds config.json, the agent workspace, .security.yml and the
# session state, so it should be persisted.
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /root/.picoclaw

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Gateway bind address inside the container. The launcher defaults to 127.0.0.1,
# which would make the gateway service unreachable from outside the pod, so the
# chart sets PICOCLAW_GATEWAY_HOST to this value. Use 127.0.0.1 if you only ever
# use the web console.
gateway:
  host: 0.0.0.0

# Launcher dashboard token.
# When token is empty the launcher generates a random token on every start and
# prints it to the container log, which means the dashboard URL changes on each
# restart. Set token (or point existingSecret at a Secret that holds one) to keep
# it stable.
launcher:
  token: ""
  existingSecret: ""
  tokenKey: token

# config.json of PicoClaw.
# By default it is not managed here: configure providers and channels in the Web
# console, which stores the result in persistence.mountPath/config.json on the
# PVC. Set create=true to render one from values instead (GitOps style, keep in
# mind the values will contain API keys), or existingSecret to mount one you
# manage elsewhere. Both are mounted read-only at
# <persistence.mountPath>/config.json and are what the image requires to start
# the gateway without running onboard first.
config:
  create: false
  existingSecret: ""
  # Key inside the Secret that holds config.json.
  key: config.json
  # Rendered as the config.json content when create=true.
  data: {}
